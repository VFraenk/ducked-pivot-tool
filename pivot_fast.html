<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parquet Explorer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/idea.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --bg-alt: #f7f7f8;
    --bg-alt2: #eeeef1;
    --border: #d9d9de;
    --border-strong: #b6b6bd;
    --text: #1a1a1f;
    --text-dim: #5e5e6a;
    --text-faint: #8a8a93;
    --accent: #1f6feb;
    --accent-bg: #e7f0ff;
    --danger: #c0392b;
    --success: #2e7d32;
    --warning: #b76e00;
    --selected-bg: #fff3c4;
    --row-hover: #f1f5fb;
    --header-bg: #f3f3f5;
    --pill-bg: #eaf2ff;
    --pill-border: #b6cdf6;
    /* Pivot blue palette — darkest at outermost level, fades inward */
    --pv-h0: #2e5fa3;      /* outermost col level header */
    --pv-h1: #4a7abf;      /* second level */
    --pv-h2: #6d99d0;      /* third level / label col */
    --pv-h3: #93b3de;      /* general header bg / deep leaves */
    --pv-border: #6d99d0;  /* blue border (frame lines only) */
    --pv-sub-col: #dce6f3; /* col-subtotal cell bg */
    --pv-sub-row: #edf1f8; /* row-subtotal cell bg */
    --pv-grand: #b4c6e7;   /* grand total row/col */
    --pv-grand-dark: #8faadc; /* grand total label */
    --pv-data-border: #e2e8f0; /* interior data cell borders */
  }
  html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 13px; color: var(--text); background: var(--bg); overflow: hidden; }
  body { overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font: inherit; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  /* Top bar */
  .topbar { height: 42px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; gap: 8px; background: var(--bg-alt); font-size: 13px; flex-shrink: 0; }
  .topbar .title { font-weight: 700; letter-spacing: -0.01em; font-size: 13px; white-space: nowrap; }
  .topbar .badge { font-size: 11px; padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text-dim); white-space: nowrap; }
  .topbar-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
  .topbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  /* Topbar drop zone */
  .tb-dropzone { border: 1.5px dashed var(--border-strong); border-radius: 4px; padding: 3px 10px; font-size: 12px; color: var(--text-dim); cursor: pointer; transition: all 120ms; background: var(--bg); white-space: nowrap; flex-shrink: 0; }
  .tb-dropzone:hover, .tb-dropzone.dragover { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
  /* Topbar tables bar */
  .tb-tables { display: flex; gap: 2px; align-items: center; overflow-x: auto; flex: 1; min-width: 0; }
  .tb-tables::-webkit-scrollbar { height: 3px; }
  .tb-table-item { display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; background: var(--bg); white-space: nowrap; color: var(--text-dim); flex-shrink: 0; }
  .tb-table-item:hover { background: var(--bg-alt2); color: var(--text); }
  .tb-table-item.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 500; }
  .tb-table-remove { margin-left: 2px; color: inherit; opacity: 0.5; padding: 0 2px; border-radius: 2px; cursor: pointer; font-size: 14px; }
  .tb-table-remove:hover { opacity: 1; color: var(--danger); }
  /* Mode tabs */
  .mode-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--bg-alt); flex-shrink: 0; }
  .mode-tab { padding: 7px 16px; cursor: pointer; border-right: 1px solid var(--border); font-size: 13px; color: var(--text-dim); background: transparent; border-top: 2px solid transparent; }
  .mode-tab:hover { background: var(--bg); color: var(--text); }
  .mode-tab.active { background: var(--bg); color: var(--text); border-top-color: var(--accent); font-weight: 500; }
  /* Layout */
  .app { display: flex; flex-direction: column; height: 100vh; max-height: 100vh; overflow: hidden; }
  .main { display: flex; flex: 1 1 0; min-height: 0; overflow: hidden; }
  .sidebar { width: var(--sb-width, 240px); flex-shrink: 0; border-right: 1px solid var(--border); background: var(--bg-alt); overflow-y: auto; display: flex; flex-direction: column; transition: width 200ms ease; }
  .sidebar.collapsed { width: 0; overflow: hidden; border-right: none; }
  .sidebar.resizing { transition: none; }
  .content { flex: 1 1 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  /* Draggable column splitter between panels */
  .col-resizer { width: 6px; flex-shrink: 0; cursor: col-resize; background: transparent; position: relative; z-index: 6; }
  .col-resizer::after { content: ''; position: absolute; left: 2px; top: 0; bottom: 0; width: 2px; background: var(--border); transition: background 120ms; }
  .col-resizer:hover::after, .col-resizer.dragging::after { background: var(--accent); }
  .sidebar.collapsed + .col-resizer { display: none; }
  /* Sidebar – schema fills the pane */
  .sb-section { padding: 8px 10px; }
  .schema-fill { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 8px 10px; overflow-y: auto; }
  .schema-fill #schema-list { flex: 1; overflow-y: auto; }
  .sb-h { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); margin-bottom: 6px; font-weight: 600; }
  /* Dropzone (splash only) */
  .dropzone { border: 1.5px dashed var(--border-strong); border-radius: 6px; padding: 16px 12px; text-align: center; color: var(--text-dim); font-size: 12px; cursor: pointer; transition: all 120ms; background: var(--bg); }
  .dropzone:hover, .dropzone.dragover { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
  /* Grid */
  .grid-wrap { flex: 1 1 0; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
  .pills-bar { padding: 6px 10px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px; background: var(--bg-alt); min-height: 32px; align-items: center; flex-shrink: 0; }
  .pills-bar:empty { display: none; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; background: var(--pill-bg); border: 1px solid var(--pill-border); border-radius: 12px; font-size: 12px; }
  .pill .x { cursor: pointer; color: var(--text-dim); padding: 0 2px; }
  .pill .x:hover { color: var(--danger); }
  .grid-scroll { flex: 1 1 0; min-height: 0; min-width: 0; overflow: auto; position: relative; }
  table.dgrid { border-collapse: separate; border-spacing: 0; font-size: 12px; }
  table.dgrid thead { position: sticky; top: 0; z-index: 5; }
  table.dgrid th { background: var(--header-bg); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border-strong); padding: 0; text-align: left; font-weight: 500; user-select: none; position: relative; white-space: nowrap; vertical-align: top; }
  table.dgrid th .th-inner { display: flex; align-items: center; padding: 6px 6px 6px 8px; gap: 4px; min-height: 26px; }
  table.dgrid th .col-name { flex: 1; cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
  table.dgrid th .col-type { font-size: 10px; color: var(--text-faint); font-weight: normal; margin-left: 4px; font-family: ui-monospace, Menlo, monospace; }
  table.dgrid th .sort-ind { color: var(--accent); font-weight: bold; font-size: 11px; }
  table.dgrid th .funnel-btn { cursor: pointer; padding: 2px 4px; border-radius: 3px; color: var(--text-faint); }
  table.dgrid th .funnel-btn:hover { background: var(--bg-alt2); color: var(--text); }
  table.dgrid th .funnel-btn.active { color: var(--accent); }
  table.dgrid th .resize-handle { position: absolute; right: 0; top: 0; bottom: 0; width: 4px; cursor: col-resize; }
  table.dgrid th .resize-handle:hover { background: var(--accent); }
  table.dgrid td { padding: 4px 8px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
  table.dgrid tr:hover td { background: var(--row-hover); }
  table.dgrid td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, monospace; }
  table.dgrid td.null { color: var(--text-faint); font-style: italic; }
  /* Status bar */
  .statusbar { border-top: 1px solid var(--border); padding: 4px 10px; font-size: 11px; color: var(--text-dim); background: var(--bg-alt); display: flex; gap: 16px; align-items: center; height: 24px; flex-shrink: 0; }
  .statusbar .right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  /* Filter dialog */
  .fdialog { position: fixed; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 4px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); z-index: 100; width: 320px; height: 460px; min-width: 260px; min-height: 240px; max-width: 96vw; max-height: 92vh; display: flex; flex-direction: column; resize: both; overflow: hidden; }
  .fdialog .top-actions { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .fdialog .top-actions button { flex: 1; padding: 6px; background: var(--bg-alt); border: none; border-right: 1px solid var(--border); cursor: pointer; font-size: 12px; }
  .fdialog .top-actions button:last-child { border-right: none; }
  .fdialog .top-actions button:hover { background: var(--bg-alt2); }
  .fdialog .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .fdialog .tab { flex: 1; padding: 6px 4px; font-size: 11px; cursor: pointer; text-align: center; color: var(--text-dim); border-bottom: 2px solid transparent; }
  .fdialog .tab.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--bg); }
  .fdialog .tab:hover { background: var(--bg-alt); }
  .fdialog .body { flex: 1; overflow-y: auto; padding: 8px; min-height: 120px; display: flex; flex-direction: column; }
  .fdialog input[type=text], .fdialog input[type=number], .fdialog select { width: 100%; padding: 4px 6px; border: 1px solid var(--border); border-radius: 3px; font-size: 12px; }
  .fdialog .vlist { font-size: 12px; }
  .fdialog .vlist-item { display: flex; align-items: center; gap: 6px; padding: 2px 4px; cursor: pointer; border-radius: 2px; }
  .fdialog .vlist-item:hover { background: var(--bg-alt); }
  .fdialog .vlist-item input { margin: 0; }
  .fdialog .vlist-item .count { margin-left: auto; color: var(--text-faint); font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
  .fdialog .vlist-item .val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fdialog .vlist-item .val.null { font-style: italic; color: var(--text-faint); }
  .fdialog .footer { padding: 8px; border-top: 1px solid var(--border); display: flex; gap: 6px; justify-content: flex-end; }
  .fdialog .footer button { padding: 4px 12px; border: 1px solid var(--border); border-radius: 3px; cursor: pointer; background: var(--bg); font-size: 12px; }
  .fdialog .footer button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .fdialog .footer button.primary:hover { background: #1858c4; }
  .fdialog .footer button:hover { background: var(--bg-alt); }
  /* Pivot UI */
  .pivot-mode { display: flex; flex: 1 1 0; min-height: 0; min-width: 0; overflow: hidden; }
  .pivot-fields { width: var(--pf-width, 320px); flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg-alt); min-height: 0; overflow-y: auto; transition: width 200ms ease; }
  .pivot-fields.resizing { transition: none; }
  .pivot-fields-h { padding: 8px 10px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 12px; flex-shrink: 0; }
  .pivot-fields-list { padding: 6px; overflow-y: auto; flex: 0 1 auto; min-height: 60px; max-height: 220px; flex-shrink: 0; }
  .pivot-field { display: flex; align-items: center; gap: 6px; padding: 4px 6px; font-size: 12px; cursor: grab; border-radius: 3px; user-select: none; overflow: hidden; }
  .pivot-field:hover { background: var(--bg-alt2); }
  .pivot-field input { margin: 0; flex-shrink: 0; }
  .pivot-field span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pivot-tiles { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(2, minmax(100px, 1fr)); gap: 4px; padding: 6px; border-top: 1px solid var(--border); min-height: 260px; flex-shrink: 0; }
  .pivot-tile { border: 1px solid var(--border); background: var(--bg); border-radius: 3px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .pivot-tile-h { padding: 4px 6px; font-size: 11px; font-weight: 600; color: var(--text-dim); display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--border); background: var(--bg-alt); flex-shrink: 0; white-space: nowrap; overflow: hidden; }
  .pivot-tile-body { padding: 4px; flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 3px; }
  .pivot-tile.dragover { background: var(--accent-bg); border-color: var(--accent); }
  .pivot-chip { display: flex; align-items: center; gap: 4px; padding: 3px 6px; background: var(--pill-bg); border: 1px solid var(--pill-border); border-radius: 3px; font-size: 11px; cursor: grab; overflow: hidden; min-width: 0; position: relative; }
  .pivot-chip.drag-over-before { border-top: 2px solid var(--accent); }
  .pivot-chip.drag-over-after { border-bottom: 2px solid var(--accent); }
  .pivot-chip .agg { font-family: ui-monospace, Menlo, monospace; color: var(--accent); font-size: 10px; padding: 0 2px; border: 1px solid var(--pill-border); border-radius: 2px; background: var(--bg); flex-shrink: 0; }
  .pivot-chip .filter-btn { cursor: pointer; padding: 1px 2px; color: var(--text-faint); display: inline-flex; align-items: center; flex-shrink: 0; border-radius: 2px; }
  .pivot-chip .filter-btn:hover { background: var(--bg-alt2); color: var(--text); }
  .pivot-chip .filter-btn.active { color: var(--accent); }
  .pivot-chip .filter-btn .icon { width: 11px; height: 11px; }
  .pivot-chip .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pivot-content { flex: 1 1 0; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
  .pivot-toolbar { padding: 6px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; background: var(--bg-alt); align-items: center; font-size: 12px; flex-shrink: 0; }
  .pivot-toolbar button { padding: 3px 8px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg); cursor: pointer; font-size: 11px; }
  .pivot-toolbar button:hover { background: var(--bg-alt2); }
  .pivot-toolbar button.preset-btn { display: inline-flex; align-items: center; gap: 4px; }
  .pivot-toolbar .btn-ico { display: inline-flex; }
  .pivot-toolbar .btn-ico .icon { width: 12px; height: 12px; }
  .pivot-toolbar button.preset-on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pivot-toolbar button.preset-on:hover { background: var(--accent); filter: brightness(1.08); }
  .pivot-toolbar .pv-hide-toggle { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; user-select: none; }
  .pivot-toolbar .pv-hide-toggle input { margin: 0; }
  /* Pivot grid */
  table.pgrid { border-collapse: separate; border-spacing: 0; font-size: 12px; }
  table.pgrid thead { position: sticky; top: 0; z-index: 5; border-bottom: 2px solid var(--pv-border); }
  /* All header cells — no individual borders; the thead border-bottom provides the single clean divider */
  table.pgrid th {
    background: var(--pv-h3);
    color: #fff;
    border-right: none;
    border-bottom: none;
    padding: 5px 10px;
    text-align: left;
    font-weight: 600;
    white-space: nowrap;
  }
  /* Label/row-dim header (top-left sticky cell) — darkest, right frame border only */
  table.pgrid th.label {
    background: var(--pv-h0);
    color: #fff;
    font-weight: 700;
    position: sticky;
    left: 0;
    z-index: 6;
    border-right: 2px solid var(--pv-border);
    border-bottom: none;
  }
  /* Data cells */
  table.pgrid td {
    padding: 4px 10px;
    border-right: 1px solid var(--pv-data-border);
    border-bottom: 1px solid var(--pv-data-border);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, Menlo, monospace;
    text-align: right;
  }
  /* Row label cells (sticky left column) */
  table.pgrid td.label {
    background: #f5f8fc;
    position: sticky;
    left: 0;
    z-index: 4;
    text-align: left;
    font-family: inherit;
    font-weight: 500;
    border-right: 2px solid var(--pv-border);
  }
  /* Row subtotals — soft blue-gray */
  table.pgrid tr.subtotal td { background: var(--pv-sub-row); font-weight: 600; }
  table.pgrid tr.subtotal td.label { background: #dce6f3; }
  /* Grand total row */
  table.pgrid tr.grandtotal td {
    background: var(--pv-grand);
    font-weight: 700;
    border-top: 2px solid var(--pv-border);
  }
  table.pgrid tr.grandtotal td.label {
    background: var(--pv-grand-dark);
    color: #fff;
    border-right: 2px solid var(--pv-border);
  }
  /* Report filter bar above pivot — matching pivot color scheme */
  .pivot-report-filters {
    padding: 8px 14px;
    background: var(--pv-h3);
    border-bottom: 2px solid var(--pv-border);
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex-shrink: 0;
  }
  .pivot-report-filters .prf-row {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 12px;
    color: #fff;
  }
  .pivot-report-filters .prf-label {
    font-weight: 600;
    min-width: 110px;
    color: rgba(255,255,255,0.85);
  }
  .pivot-report-filters .prf-btn {
    border: 1px solid rgba(255,255,255,0.5);
    padding: 3px 8px;
    border-radius: 3px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    min-width: 130px;
    background: rgba(255,255,255,0.12);
    color: #fff;
    gap: 8px;
    font-size: 12px;
    transition: background 120ms;
  }
  .pivot-report-filters .prf-btn:hover { background: rgba(255,255,255,0.25); }
  /* SQL console */
  .sql-mode { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .sql-edit-wrap { border-bottom: 1px solid var(--border); min-height: 80px; max-height: 50%; display: flex; flex-direction: column; resize: vertical; overflow: hidden; }
  .CodeMirror { height: 100%; font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sql-toolbar { padding: 6px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; background: var(--bg-alt); align-items: center; font-size: 12px; }
  .sql-toolbar button { padding: 4px 12px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg); cursor: pointer; font-size: 12px; }
  .sql-toolbar button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .sql-toolbar button.primary:hover { background: #1858c4; }
  .sql-error { color: var(--danger); padding: 6px 10px; background: #fdecea; border-bottom: 1px solid #f5c2c0; font-size: 12px; font-family: ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  /* Misc */
  .btn { padding: 4px 10px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg); cursor: pointer; font-size: 12px; color: var(--text); }
  .btn:hover { background: var(--bg-alt2); }
  .btn-sm { padding: 2px 6px; font-size: 11px; }
  .icon { width: 14px; height: 14px; display: inline-block; vertical-align: middle; flex-shrink: 0; pointer-events: none; }
  .icon-wrap { display: inline-flex; align-items: center; pointer-events: none; }
  .chev { cursor: pointer; display: inline-flex; align-items: center; width: 14px; color: var(--text-dim); }
  .chev .icon { width: 12px; height: 12px; }
  .chev:hover { color: var(--text); }
  .pivot-chip .menu-btn .icon { width: 12px; height: 12px; }
  table.dgrid th .funnel-btn .icon { width: 12px; height: 12px; }
  .splash { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; flex: 1; padding: 32px; color: var(--text-dim); }
  .splash .big-dropzone { width: 100%; max-width: 480px; padding: 48px 24px; font-size: 14px; }
  .ctx-menu { position: fixed; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); z-index: 200; min-width: 160px; padding: 4px 0; font-size: 12px; }
  .ctx-menu-item { padding: 5px 12px; cursor: pointer; }
  .ctx-menu-item:hover { background: var(--accent-bg); }
  .ctx-menu-sep { border-top: 1px solid var(--border); margin: 4px 0; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--bg-alt2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .agg-select { padding: 1px 2px; font-size: 10px; border: 1px solid var(--pill-border); border-radius: 2px; background: var(--bg); }

// ── IndexedDB: store raw parquet buffers so tables survive a page reload ──
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

  return new Promise((resolve, reject) => { const tx = db.transaction(IDB_STORE, 'readwrite'); tx.objectStore(IDB_STORE).put(value, key); tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error); });
}

  const db = await idbOpen();

    const tx = db.transaction(IDB_STORE, 'readonly'), store = tx.objectStore(IDB_STORE), out = [];
    const cur = store.openCursor();
    cur.onsuccess = () => { const c = cur.result; if (c) { out.push({ key: c.key, value: c.value }); c.continue(); } else resolve(out); };
    cur.onerror = () => reject(cur.error);

}

  return new Promise((resolve, reject) => { const tx = db.transaction(IDB_STORE, 'readwrite'); tx.objectStore(IDB_STORE).delete(key); tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error); });

// DUCKDB INIT
async function initDuckDB() {
  const bundles = duckdb.getJsDelivrBundles();
  const bundle = await duckdb.selectBundle(bundles);
  const worker_url = URL.createObjectURL(new Blob([`importScripts("${bundle.mainWorker}");`], { type: 'text/javascript' }));
  const worker = new Worker(worker_url);
  const logger = new duckdb.ConsoleLogger(duckdb.LogLevel.WARNING);
  const db = new duckdb.AsyncDuckDB(logger, worker);
  await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
  URL.revokeObjectURL(worker_url);
  state.db = db; state.conn = await db.connect();
  setDbStatus('ready');
}

async function runQuery(sql) {
  const t0 = performance.now();
  let result;
  try { result = await state.conn.query(sql); } catch (e) { throw new Error(String(e.message || e)); }
  const ms = performance.now() - t0;
  const cols = result.schema.fields.map(f => ({ name: f.name, type: String(f.type), kind: classifyType(String(f.type)) }));
  const raw = result.toArray();
  const rows = new Array(raw.length);
  for (let i = 0; i < raw.length; i++) {
    const obj = raw[i].toJSON();
    for (const k in obj) {
      const v = obj[k];
      if (typeof v === 'bigint') obj[k] = (v >= -9007199254740992n && v <= 9007199254740992n) ? Number(v) : v.toString();
    }
    rows[i] = obj;
  }
  state.lastQueryMs = ms;
  return { rows, columns: cols, ms };
}
function classifyType(t) {
  const u = t.toUpperCase();
  if (/INT|DECIMAL|DOUBLE|FLOAT|REAL|HUGEINT|NUMERIC|NUMBER/.test(u)) return 'num';
  if (/DATE|TIME|TIMESTAMP/.test(u)) return 'date';
  if (/BOOL/.test(u)) return 'bool';
  return 'text';
}

// LOAD PARQUET
async function loadFiles(fileList) {
  for (const file of fileList) {
    if (!file.name.toLowerCase().endsWith('.parquet')) continue;
    try {
      const buf = new Uint8Array(await file.arrayBuffer());
      await registerParquet(buf, file.name);
    } catch (e) { toast(tt('loadFailed', file.name, e.message), true); }
  }
  renderAll();
  if (state.activeTable) refreshActiveView();
  scheduleSave();
}

// Registers a parquet buffer as a DuckDB view and wires up its view state.
// Used both for fresh file loads and for restoring persisted files on boot.
async function registerParquet(buf, fileName, opts = {}) {
  const { tableName: forcedName, prefs = null, persist = true } = opts;
  const tableName = forcedName || sanitizeTableName(fileName, state.tables.map(t => t.name));
  const regName = tableName + '.parquet';            // unique virtual name keyed off the (unique) table name
  try { await state.db.dropFile(regName); } catch (_) {}
  await state.db.registerFileBuffer(regName, buf);
  await state.conn.query(`CREATE OR REPLACE VIEW ${qid(tableName)} AS SELECT * FROM read_parquet(${qlit(regName)})`);
  const schemaRes = await runQuery(`DESCRIBE ${qid(tableName)}`);
  const schema = schemaRes.rows.map(r => ({ name: r.column_name, type: r.column_type, kind: classifyType(r.column_type) }));
  const cRes = await runQuery(`SELECT COUNT(*) AS c FROM ${qid(tableName)}`);
  state.tables.push({ name: tableName, file: regName, origName: fileName, schema, rowCount: Number(cRes.rows[0].c) });
  // Defaults first, then overlay any persisted view settings for this table name.
  state.filters[tableName] = {}; state.sorts[tableName] = null; state.hidden[tableName] = new Set(); state.colWidths[tableName] = {};
  state.pivot[tableName] = newPivotState();
  if (prefs) applyTablePrefs(tableName, prefs);
  if (!state.activeTable) state.activeTable = tableName;
  if (persist && state.settings.rememberFiles) {
    try { await idbPut(tableName, { fileName, buffer: buf.buffer.slice(buf.byteOffset, buf.byteOffset + buf.byteLength) }); }
    catch (e) { console.warn('Could not persist file to IndexedDB:', e); }
  }
  return tableName;
}
function sanitizeTableName(filename, existing) {
  let base = filename.replace(/\.parquet$/i, '').replace(/[^A-Za-z0-9_]/g, '_');
  if (!base || /^\d/.test(base)) base = 't_' + base;
  let n = base, i = 1; while (existing.includes(n)) n = base + '_' + (++i); return n;
}
function newPivotState() { return { filters: [], cols: [], rows: [], values: [], expanded: new Set(), colExpanded: new Set(), subtotals: 'top', showAs: 'abs', hideBelowPct: false }; }

// FILTER -> SQL
function buildWhere(table, filters) {
  const clauses = [];
  for (const [col, f] of Object.entries(filters || {})) {
    if (!f) continue;
    const c = qid(col);
    if (f.type === 'values') {
      if (!f.included && f.includeBlank) continue;
      const vals = f.included ? [...f.included] : [];
      const parts = [];
      if (vals.length > 0) parts.push(`${c} IN (${vals.map(v => qlit(v)).join(',')})`);
      if (f.includeBlank) parts.push(`${c} IS NULL`);
      clauses.push(parts.length === 0 ? 'FALSE' : '(' + parts.join(' OR ') + ')');
    } else if (f.type === 'num') {
      if (f.op === 'between') clauses.push(`${c} BETWEEN ${qlit(+f.a)} AND ${qlit(+f.b)}`);
      else if (['>','<','=','>=','<=','!='].includes(f.op)) clauses.push(`${c} ${f.op} ${qlit(+f.a)}`);
    } else if (f.type === 'text') {
      const a = String(f.a ?? '');
      let textClause = null;
      if (f.op === 'contains') textClause = `${c}::VARCHAR ILIKE ${qlit('%'+a+'%')}`;
      else if (f.op === 'begins') textClause = `${c}::VARCHAR ILIKE ${qlit(a+'%')}`;
      else if (f.op === 'ends') textClause = `${c}::VARCHAR ILIKE ${qlit('%'+a)}`;
      else if (f.op === 'eq') textClause = `${c} = ${qlit(a)}`;
      else if (f.op === 'regex') textClause = `regexp_matches(${c}::VARCHAR, ${qlit(a)})`;
      if (textClause) {
        let clause = f.not ? `NOT (${textClause})` : textClause;
        // keepNull: treat NULL/blank as a match (e.g. "!= X" should keep blanks, like pandas/Excel).
        if (f.keepNull) clause = `(${clause} OR ${c} IS NULL)`;
        clauses.push(clause);
      }
    } else if (f.type === 'date') {
      const lit = (s) => `CAST(${qlit(s)} AS TIMESTAMP)`;
      if (f.op === 'between') clauses.push(`${c} BETWEEN ${lit(f.a)} AND ${lit(f.b)}`);
      else if (['>','<','=','>=','<=','!='].includes(f.op)) clauses.push(`${c} ${f.op} ${lit(f.a)}`);
    }
  }
  return clauses.length ? 'WHERE ' + clauses.join(' AND ') : '';
}

// TABLE VIEW: refresh
async function refreshTableView() {
  if (!state.activeTable) return;
  const tn = state.activeTable, table = state.tables.find(t => t.name === tn);
  const filters = state.filters[tn] || {}, sort = state.sorts[tn];
  const where = buildWhere(table, filters);
  let topN = '';
  for (const [col, f] of Object.entries(filters)) if (f && f.type === 'num' && f.op === 'topN') topN = `ORDER BY ${qid(col)} DESC LIMIT ${parseInt(f.a)||10}`;
  
  state.totalRows = table.rowCount;
  try {
    const cRes = await runQuery(topN ? `SELECT COUNT(*) AS c FROM (SELECT * FROM ${qid(tn)} ${where} ${topN}) sub` : `SELECT COUNT(*) AS c FROM ${qid(tn)} ${where}`);
    state.filteredRows = Number(cRes.rows[0].c);
  } catch (e) { toast(tt('filterError', e.message), true); return; }
  
  const maxPage = Math.max(0, Math.ceil(state.filteredRows / state.pageSize) - 1);
  if (state.page > maxPage) state.page = maxPage;
  const offset = state.page * state.pageSize;
  const orderClause = sort ? `ORDER BY ${qid(sort.col)} ${sort.dir.toUpperCase()}` : '';
  const colSel = table.schema.filter(c => !state.hidden[tn].has(c.name)).map(c => qid(c.name)).join(', ');
  
  try {
    const q = topN ? `SELECT ${colSel} FROM (SELECT * FROM ${qid(tn)} ${where} ${topN}) sub ${orderClause} LIMIT ${state.pageSize} OFFSET ${offset}` : `SELECT ${colSel} FROM ${qid(tn)} ${where} ${orderClause} LIMIT ${state.pageSize} OFFSET ${offset}`;
    const res = await runQuery(q);
    state.rows = res.rows;
    renderContent();
    scheduleSave();
  } catch (e) { toast(tt('queryError', e.message), true); }
}

async function dropTable(name) {
  const idx = state.tables.findIndex(t => t.name === name); if (idx === -1) return;
  const t = state.tables[idx];
  try { await state.conn.query(`DROP VIEW IF EXISTS ${qid(name)}`); await state.db.dropFile(t.file); } catch (_) {}
  delete state.filters[name]; delete state.sorts[name]; delete state.hidden[name]; delete state.colWidths[name]; delete state.pivot[name];
  for (const k of [...state.distinctCache.keys()]) if (k.startsWith(name + '::')) state.distinctCache.delete(k);

  if (state.activeTable === name) { state.activeTable = state.tables[0]?.name || null; state.page = 0; state.rows = []; state.pivotShape = null; state.sqlResult = null; }

function filterSummary(f) {

function buildPivotShape(rowDims, colDims, valueDefs, rows, pv) {

  const colTreeRoot = { key: '__root', label: 'Grand Total', children: [], depth: -1, vals: [], _byKey: new Map() };
  const cellMap = new Map();

  for (const r of rows) {
    let rDepth = rowDims.length; for (let i = 0; i < rowDims.length; i++) if (Number(r['g_' + i]) === 1) { rDepth = i; break; }
    let cDepth = colDims.length; for (let i = 0; i < colDims.length; i++) if (Number(r['g_' + (rowDims.length + i)]) === 1) { cDepth = i; break; }

    const rVals = rowDims.map(d => r[d]), cVals = colDims.map(d => r[d]);
    const rKey = safeJoin(rVals.slice(0, rDepth)), cKey = safeJoin(cVals.slice(0, cDepth));

    if (rDepth === rowDims.length && cDepth === colDims.length) {
      let node = rowTreeRoot;
      for (let i = 0; i < rowDims.length; i++) {
        const key = '__root|' + safeJoin(rVals.slice(0, i+1));
        let child = node._byKey.get(key);
        if (!child) { child = { key, label: rVals[i] === null || rVals[i] === undefined ? '∅' : String(rVals[i]), children: [], depth: i, vals: rVals.slice(0, i+1), _byKey: new Map() }; node._byKey.set(key, child); node.children.push(child); }
        node = child;
      }
      let cnode = colTreeRoot;
      for (let i = 0; i < colDims.length; i++) {
        const key = '__root|' + safeJoin(cVals.slice(0, i+1));
        let child = cnode._byKey.get(key);
        if (!child) { child = { key, label: cVals[i] === null || cVals[i] === undefined ? '∅' : String(cVals[i]), children: [], depth: i, vals: cVals.slice(0, i+1), _byKey: new Map() }; cnode._byKey.set(key, child); cnode.children.push(child); }

    const isExpanded = isRoot || pv.colExpanded.has(node.key);

    } else if (!isRoot) leafCols.push({ ...node, isColSubtotal: false, isCollapsed: true });
  }

  const leafRows = [], flatRowOrder = [];
  function walkRow(node) {
    const isRoot = node === rowTreeRoot;
    if (!isRoot) leafRows.push(node);
    const isExpanded = isRoot || pv.expanded.has(node.key);
    if (isExpanded && node.children.length > 0) {
      if (pv.subtotals === 'top' && !isRoot) flatRowOrder.push({ node, isSubtotal: true });
      node.children.forEach(walkRow);
      if (pv.subtotals === 'bottom' && !isRoot) flatRowOrder.push({ node, isSubtotal: true });

    const nodeKey = node.key; // '__root' for the grand-total row
    for (const pr of prunedRoots) {
      if (nodeKey !== '__root' && pr.key !== nodeKey && !pr.key.startsWith(nodeKey + '|')) continue;
      const sub = cellMap.get(safeJoin(pr.vals) + '#' + cKey);
      if (sub) for (let vi = 0; vi < nValues; vi++) { const s = Number(sub[vi]); if (isFinite(s)) out[vi] -= s; }
    }
    return out;
  };

  for (let lvl = 0; lvl < colHeaderRows; lvl++) {
    const tr = el('tr');
    if (lvl === 0) tr.appendChild(el('th', { class:'label', rowspan: colHeaderRows + (nValues > 1 ? 1 : 0) }, sh.rowDims.length ? sh.rowDims.join(' / ') : ''));

    if (!hasColDims) { tr.appendChild(el('th', { colspan: nValues, style:`background:${pvHdrBg(0)}; color:#fff; font-weight:700;` }, tt('grandTotal'))); thead.appendChild(tr); continue; }

    let i = 0;
    while (i < sh.leafCols.length) {
      const col = sh.leafCols[i];
      if (col.isColSubtotal && lvl === col.depth) {
        const rs = colHeaderRows - lvl;
        // col-subtotal header: one shade lighter than the depth it belongs to
        const subBg = pvHdrBg(col.depth + 1);
        tr.appendChild(el('th', { rowspan: rs, colspan: nValues, style: `background:${subBg}; color:#fff; font-weight:700;` }, col.label + ' Total')); i++; continue;
      }
      if (col.isColSubtotal && lvl > col.depth) { i++; continue; }
      if (!col.isColSubtotal && lvl >= col.vals.length) { i++; continue; }

      let j = i;
      while (j < sh.leafCols.length) {
        const nextCol = sh.leafCols[j];
        if (nextCol.isColSubtotal && lvl >= nextCol.depth) break;
        if (!nextCol.isColSubtotal && lvl >= nextCol.vals.length) break;
        if (String(nextCol.vals[lvl]) !== String(col.vals[lvl])) break;
        j++;
      }

      const th = el('th', { colspan: (j - i) * nValues, rowspan: col.vals.length === lvl + 1 ? colHeaderRows - lvl : 1,
        style: `background:${pvHdrBg(lvl)}; color:#fff;` });
      const groupKey = '__root|' + safeJoin(col.vals.slice(0, lvl + 1)), node = getColNode(sh.colTree, groupKey);
      if (node && node.children.length > 0) {
        const isExp = pv.colExpanded.has(groupKey);
        th.appendChild(el('span', { class:'chev', style:'margin-right:4px; color:#fff;', html: isExp ? ICONS.chevDown : ICONS.chevRight, onclick: () => { if (isExp) pv.colExpanded.delete(groupKey); else pv.colExpanded.add(groupKey); rebuildPivotShape(); renderContent(); } }));
      }
      const label = col.vals[lvl] !== undefined ? String(col.vals[lvl]) : '';
      th.appendChild(document.createTextNode(label === 'null' || label === 'undefined' ? '∅' : label));
      tr.appendChild(th); i = j;
    }
    if (lvl === 0) tr.appendChild(el('th', { rowspan: colHeaderRows, colspan: nValues, style:`background:${pvHdrBg(0)}; color:#fff; font-weight:700;` }, tt('grandTotal')));
    thead.appendChild(tr);
  }

  if (nValues > 1) {
    const tr = el('tr');
    const deepestLvl = Math.max(0, sh.colDims.length - 1);
    for (const col of sh.leafCols) {
      const bg = col.isColSubtotal ? pvHdrBg(col.depth + 1) : pvHdrBg(deepestLvl);
      for (const vdef of sh.valueDefs) tr.appendChild(el('th', { style: `background:${bg}; color:#fff; font-weight:500;` }, `${vdef.agg.replace('_',' ')}(${vdef.col})`));
    }
    if (hasColDims) for (const vdef of sh.valueDefs) tr.appendChild(el('th', { style:`background:${pvHdrBg(0)}; color:#fff; font-weight:500;` }, `${vdef.agg.replace('_',' ')}(${vdef.col})`));
    thead.appendChild(tr);
  }
  table.appendChild(thead);

  const tbody = el('tbody');
  for (const entry of sh.flatRowOrder) {
    const node = entry.node, isGrand = !!entry.isGrand, isSubtotal = !!entry.isSubtotal;
    let rowStyle = '';
    let rowClass = '';
    if (isGrand) {
      rowClass = 'grandtotal';
    } else if (isSubtotal) {
      rowClass = 'subtotal';
      // Only the outermost subtotal level gets a top border; no inline weight override —
      // the label td handles per-depth font weight below.
      if (node.depth === 0) rowStyle = 'border-top: 2px solid var(--pv-border);';
    } else {
      rowStyle = '';
    }

    // Hide long-tail rows/groups (the grand total always stays).
    if (!isGrand && hiddenRowKeys.has(node.key)) continue;

    // "Automotive Total" → "Automotive" (no suffix); label font weight: bold only at depth 0
    const labelStr = isGrand
      ? tt('grandTotal')
      : node.label;   // suffix removed; hierarchy is clear from indentation + bold

    const labelTd = el('td', { class:'label', style: `padding-left:${8 + (node.depth + 1) * 12}px; font-weight:${isSubtotal && node.depth === 0 ? '700' : (isSubtotal ? '600' : '400')};` });
    const tr = el('tr', { class: rowClass, style: rowStyle });
    if (!isGrand && node.children.length > 0) {
      const isExp = pv.expanded.has(node.key);
      labelTd.appendChild(el('span', { class:'chev', style:'color:var(--pv-h1);', html: isExp ? ICONS.chevDown : ICONS.chevRight, onclick: () => { if (isExp) pv.expanded.delete(node.key); else pv.expanded.add(node.key); rebuildPivotShape(); renderContent(); } }));
      labelTd.appendChild(document.createTextNode(' ' + labelStr));
    } else labelTd.textContent = labelStr;
    tr.appendChild(labelTd);

    const rKey = isGrand ? '' : safeJoin(node.vals);
    const isTotalRow = isGrand || isSubtotal; // total rows show the leftover after pruning
    for (const leafCol of sh.leafCols) {
      const cKey = safeJoin(leafCol.vals);
      const cell = isTotalRow ? visibleTotal(node, rKey, cKey) : cellMap.get(rKey + '#' + cKey);
      const isColSub = !!leafCol.isColSubtotal;
      let cellStyle = '';
      if (isGrand) {
        cellStyle = 'background:var(--pv-grand); font-weight:700;';
      } else if (isSubtotal && isColSub) {
        cellStyle = 'background:#c8d8ee; font-weight:700;';
      } else if (isColSub) {
        cellStyle = 'background:var(--pv-sub-col); font-weight:600;';
      } else if (isSubtotal) {
        cellStyle = 'background:var(--pv-sub-row); font-weight:600;';
      }
      for (let vi = 0; vi < sh.valueDefs.length; vi++) { tr.appendChild(el('td', { style: cellStyle }, cellText(cell, vi, rKey, cKey))); }
    }
    if (hasColDims) {
      const grandCell = isTotalRow ? visibleTotal(node, rKey, '') : cellMap.get(rKey + '#');
      for (let vi = 0; vi < sh.valueDefs.length; vi++) { tr.appendChild(el('td', { style: isGrand ? 'background:var(--pv-grand); font-weight:700; border-left:2px solid var(--pv-border);' : isSubtotal ? 'background:#b4c6e7; font-weight:700; border-left:2px solid var(--pv-border);' : 'background:#dce6f3; font-weight:600; border-left:2px solid var(--pv-border);' }, cellText(grandCell, vi, rKey, ''))); }
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody); return table;
}

// Number formatters follow the active locale so the whole grid stays consistent
// (German: 1.234.567,89 — English US: 1,234,567.89). Rebuilt when the locale changes.
let NUM_FMT_INT, NUM_FMT_DEC, NUM_FMT_CELL, NUM_FMT_PCT;
function rebuildNumberFormats() {
  const loc = (LOCALES[state.settings.locale] || LOCALES.de).intl;
  NUM_FMT_INT  = new Intl.NumberFormat(loc);
  NUM_FMT_DEC  = new Intl.NumberFormat(loc, { maximumFractionDigits: 4 });
  NUM_FMT_CELL = new Intl.NumberFormat(loc, { maximumFractionDigits: 6 });
  NUM_FMT_PCT  = new Intl.NumberFormat(loc, { style: 'percent', minimumFractionDigits: 1, maximumFractionDigits: 1 });
}
rebuildNumberFormats();
function fmtNum(v) {
  if (typeof v !== 'number') return String(v);
  return Number.isInteger(v) ? NUM_FMT_INT.format(v) : NUM_FMT_DEC.format(v);
}
// Format a ratio (e.g. 0.123) as a locale-aware percentage (e.g. "12,3 %").
function fmtPct(ratio) {
  if (typeof ratio !== 'number' || !isFinite(ratio)) return '';
  if (!NUM_FMT_PCT) NUM_FMT_PCT = new Intl.NumberFormat((LOCALES[state.settings.locale] || LOCALES.de).intl, { style: 'percent', minimumFractionDigits: 1, maximumFractionDigits: 1 });
  return NUM_FMT_PCT.format(ratio);
}

let sqlEditor = null;
function renderSQLMode() {
  const wrap = el('div', { class:'sql-mode' });
  wrap.appendChild(el('div', { class:'sql-edit-wrap' }, el('textarea', { id:'sql-editor-ta' }, state.sqlText)));
  wrap.appendChild(el('div', { class:'sql-toolbar' }, el('button', { class:'primary', onclick: runSQLEditor }, tt('run')), el('span', { style:'color:var(--text-faint); font-size:11px;' }, tt('sqlHint')), el('span', { style:'margin-left:auto;' }, el('button', { onclick: () => openExportMenu('sql'), disabled: state.sqlResult ? null : '' }, tt('exportResult')))));
  if (state.sqlError) wrap.appendChild(el('div', { class:'sql-error' }, state.sqlError));
  const resultWrap = el('div', { class:'grid-scroll', style:'flex:1;' });
  if (state.sqlResult) resultWrap.appendChild(renderSimpleGrid(state.sqlResult.rows, state.sqlResult.columns)); else resultWrap.appendChild(el('div', { style:'padding:24px; color:var(--text-faint);' }, tt('runToSee')));
  wrap.appendChild(resultWrap);
  wrap.appendChild(el('div', { class:'statusbar' }, el('span', null, state.sqlResult ? tt('rowsN', state.sqlResult.rows.length.toLocaleString(activeLocale().intl)) : ''), el('span', { style:'margin-left:auto;' }, state.sqlResult ? `${state.sqlResult.ms.toFixed(0)} ms` : '')));
  return wrap;
}

function initSQLEditor() {
  const ta = $('#sql-editor-ta'); if (!ta || sqlEditor) return;
  sqlEditor = CodeMirror.fromTextArea(ta, { mode: 'text/x-sql', lineNumbers: true, theme: 'idea', tabSize: 2, indentWithTabs: false, extraKeys: { 'Ctrl-Enter': runSQLEditor, 'Cmd-Enter': runSQLEditor } });
  sqlEditor.setSize('100%','100%'); sqlEditor.on('change', () => { state.sqlText = sqlEditor.getValue(); scheduleSave(); });
}

async function runSQLEditor() {
  if (!sqlEditor) return; const sql = sqlEditor.getValue(); state.sqlError = null;
  try { state.sqlResult = await runQuery(sql); } catch (e) { state.sqlError = e.message; state.sqlResult = null; }
  renderContent(); setTimeout(initSQLEditor, 0);
}

function renderSimpleGrid(rows, columns) {
  const table = el('table', { class:'dgrid' }), trH = el('tr');
  for (const c of columns) trH.appendChild(el('th', null, el('div', { class:'th-inner' }, el('span', { class:'col-name' }, c.name, el('span', { class:'col-type' }, kindLabel(c.kind))))));
  table.appendChild(el('thead', null, trH)); const tbody = el('tbody'), limit = Math.min(rows.length, 5000);
  for (let i = 0; i < limit; i++) {
    const tr = el('tr');
    for (const c of columns) { const v = rows[i][c.name], isNull = v === null || v === undefined; tr.appendChild(el('td', { class: (isNull?'null ':'') + (c.kind==='num'?'num':'') }, isNull ? 'NULL' : fmtCell(v, c.kind))); }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  if (rows.length > limit) tbody.appendChild(el('tr', null, el('td', { colspan: columns.length, style:'text-align:center; padding:8px; color:var(--text-faint);' }, tt('moreRows', (rows.length - limit).toLocaleString(activeLocale().intl)))));
  return table;
}

function openExportMenu(source) {
  const close = () => { $('#dialog-root').innerHTML = ''; document.removeEventListener('mousedown', outside); };
  const outside = (ev) => { if (!menu.contains(ev.target)) close(); };
  const locLabel = (LOCALES[state.settings.locale] || LOCALES.de).intl === 'de-DE' ? 'DE' : 'US';
  const item = (label, fn, extra) => el('div', { class:'ctx-menu-item row', onclick: () => { close(); fn(); } }, el('span', null, label), extra || null);
  const menu = el('div', { class:'ctx-menu', style:'right:16px; bottom:40px; min-width:200px;' },
    el('div', { class:'ctx-menu-h' }, tt('expSpreadsheet')),
    item('Excel (.xlsx)', () => exportXlsx(source), el('span', { class:'badge-sm' }, locLabel)),
    el('div', { class:'ctx-menu-sep' }),
    el('div', { class:'ctx-menu-h' }, tt('expData')),
    item('CSV', () => doExport(source, 'csv')),
    item('JSON', () => doExport(source, 'json')),
    item('Parquet', () => doExport(source, 'parquet'))
  );
  $('#dialog-root').appendChild(menu); setTimeout(() => document.addEventListener('mousedown', outside), 0);
}

// ── Excel export via ExcelJS (styling + native row/column outline grouping) ──
// Locale-aware number/date formats are forced with an LCID prefix so the file
// renders German (or US) regardless of the viewer's regional settings.
function activeLocale() { return LOCALES[state.settings.locale] || LOCALES.de; }
function numFmtCode(isInt) { const lc = activeLocale().lcid; return isInt ? `[$-${lc}]#,##0` : `[$-${lc}]#,##0.####`; }
function dateFmtCode() { const loc = activeLocale(); return `[$-${loc.lcid}]${loc.dateTimeFmt}`; }

// Pivot header palette (matches the on-screen blue scale; darkest outermost).
const XLSX_HDR = ['FF2E5FA3','FF4A7ABF','FF6D99D0','FF93B3DE','FFA8C0E4'];
const xlsxHdrBg = (d) => XLSX_HDR[Math.min(Math.max(d, 0), XLSX_HDR.length - 1)];
const solid = (argb) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
const thin = (argb = 'FFE2E8F0') => ({ style: 'thin', color: { argb } });
const allBorders = (argb) => ({ top: thin(argb), left: thin(argb), bottom: thin(argb), right: thin(argb) });
const sanitizeSheet = (n) => (n || 'Sheet1').replace(/[\\\/\?\*\[\]:]/g, '_').slice(0, 31) || 'Sheet1';

function xlsxCellValue(v, kind) {
  if (v === null || v === undefined) return null;
  if (kind === 'date') { const d = v instanceof Date ? v : new Date(v); return isNaN(d.getTime()) ? String(v) : d; }
  if (kind === 'num') return v;
  return typeof v === 'object' ? JSON.stringify(v) : v;
}
function applyValueFormat(cell, kind) {
  if (cell.value === null || cell.value === undefined) return;
  if (kind === 'num' && typeof cell.value === 'number') { cell.numFmt = numFmtCode(Number.isInteger(cell.value)); cell.alignment = { horizontal: 'right' }; }
  else if (kind === 'date' && cell.value instanceof Date) cell.numFmt = dateFmtCode();
}

// Plain table/query export: bold frozen header, autofilter, locale formats, widths.
function buildTableSheet(wb, name, rows, columns) {
  const ws = wb.addWorksheet(sanitizeSheet(name), { views: [{ state: 'frozen', ySplit: 1 }] });
  ws.addRow(columns.map(c => c.name));
  const head = ws.getRow(1);
  for (let i = 0; i < columns.length; i++) {
    const c = head.getCell(i + 1);
    c.fill = solid(xlsxHdrBg(0)); c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
    c.alignment = { vertical: 'middle' }; c.border = allBorders('FF6D99D0');
  }
  for (const r of rows) {
    const row = ws.addRow(columns.map(c => xlsxCellValue(r[c.name], c.kind)));
    for (let i = 0; i < columns.length; i++) applyValueFormat(row.getCell(i + 1), columns[i].kind);
  }
  columns.forEach((c, i) => {
    let w = c.name.length;
    for (let k = 0; k < Math.min(rows.length, 200); k++) { const v = rows[k][c.name]; if (v != null) w = Math.max(w, String(v).length); }
    ws.getColumn(i + 1).width = Math.min(48, Math.max(10, w + 2));
  });
  if (columns.length) ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: columns.length } };
}

// Full, grouped, styled pivot. Rebuilds the shape fully-expanded (so every level
// is present regardless of on-screen collapse state) and maps the hierarchy onto
// native Excel row/column outline groups, mirroring the web pivot's drill-down.
function buildPivotSheet(wb) {
  const sh0 = state.pivotShape, pv = state.pivot[state.activeTable];
  const effSub = pv.subtotals === 'off' ? 'top' : pv.subtotals;   // grouping needs summary rows to collapse into
  const allExp = expandAll(pv);                                   // every node key from the (full) trees
  const fullPv = { ...pv, subtotals: effSub, expanded: allExp.rows, colExpanded: allExp.cols };
  const sh = buildPivotShape(sh0.rowDims, sh0.colDims, sh0.valueDefs, state.pivotData, fullPv);

  const nValues = sh.valueDefs.length, D = sh.colDims.length, hasColDims = D > 0;
  const leafCols = sh.leafCols;
  const HEADER_ROWS = Math.max(1, D) + (nValues > 1 ? 1 : 0);
  const dataStartRow = HEADER_ROWS + 1;
  const firstDataCol = 2;
  const leafColStart = (i) => firstDataCol + i * nValues;
  const gtColStart = firstDataCol + leafCols.length * nValues;
  const valLabel = (vd) => `${vd.agg.replace('_', ' ')}(${vd.col})`;

  const ws = wb.addWorksheet('Pivot');

  const styleHeader = (cell, depth, bold = true) => {
    cell.fill = solid(xlsxHdrBg(depth)); cell.font = { bold, color: { argb: 'FFFFFFFF' }, size: 11 };
    cell.alignment = { horizontal: 'left', vertical: 'middle' }; cell.border = allBorders('FF6D99D0');
  };
  const mergeLabel = (r1, c1, r2, c2, text, depth, bold) => {
    if (r1 !== r2 || c1 !== c2) ws.mergeCells(r1, c1, r2, c2);
    const cell = ws.getCell(r1, c1); cell.value = text; styleHeader(cell, depth, bold);
  };

  // ── top-left label corner ──
  mergeLabel(1, 1, HEADER_ROWS, 1, sh.rowDims.join(' / '), 0, true);

  // ── column headers ──
  if (!hasColDims) {
    mergeLabel(1, firstDataCol, nValues > 1 ? 1 : HEADER_ROWS, firstDataCol + nValues - 1, tt('grandTotal'), 0, true);
  } else {
    for (let lvl = 0; lvl < D; lvl++) {
      let i = 0;
      while (i < leafCols.length) {
        const col = leafCols[i];
        if (col.isColSubtotal && lvl === col.depth) {
          mergeLabel(lvl + 1, leafColStart(i), lvl + (D - lvl), leafColStart(i) + nValues - 1, col.label + ' ' + tt('total'), col.depth + 1, true);
          i++; continue;
        }
        if (col.isColSubtotal && lvl > col.depth) { i++; continue; }
        if (!col.isColSubtotal && lvl >= col.vals.length) { i++; continue; }
        let j = i;
        while (j < leafCols.length) {
          const nx = leafCols[j];
          if (nx.isColSubtotal && lvl >= nx.depth) break;
          if (!nx.isColSubtotal && lvl >= nx.vals.length) break;
          if (String(nx.vals[lvl]) !== String(col.vals[lvl])) break;
          j++;
        }
        const rs = (col.vals.length === lvl + 1) ? (D - lvl) : 1;
        const raw = col.vals[lvl];
        const label = (raw === undefined || raw === null || raw === 'null') ? '∅' : String(raw);
        mergeLabel(lvl + 1, leafColStart(i), lvl + rs, leafColStart(j - 1) + nValues - 1, label, lvl, true);
        i = j;
      }
    }
    mergeLabel(1, gtColStart, D, gtColStart + nValues - 1, tt('grandTotal'), 0, true);
  }

  // ── value-name sub-header (only when several value fields) ──
  if (nValues > 1) {
    const vr = HEADER_ROWS, deepest = Math.max(0, D - 1);
    for (let i = 0; i < leafCols.length; i++) {
      const depthBg = leafCols[i].isColSubtotal ? leafCols[i].depth + 1 : deepest;
      for (let vi = 0; vi < nValues; vi++) { const c = ws.getCell(vr, leafColStart(i) + vi); c.value = valLabel(sh.valueDefs[vi]); styleHeader(c, depthBg, false); }
    }
    if (hasColDims) for (let vi = 0; vi < nValues; vi++) { const c = ws.getCell(vr, gtColStart + vi); c.value = valLabel(sh.valueDefs[vi]); styleHeader(c, 0, false); }
  }

  // ── data rows ──
  let maxLabelLen = sh.rowDims.join(' / ').length;
  let r = dataStartRow;
  for (const entry of sh.flatRowOrder) {
    const node = entry.node, isGrand = !!entry.isGrand, isSub = !!entry.isSubtotal;
    const row = ws.getRow(r);
    const depth = isGrand ? 0 : node.depth;

    const lcell = row.getCell(1);
    lcell.value = isGrand ? tt('grandTotal') : node.label;
    lcell.alignment = { indent: isGrand ? 0 : Math.min(depth, 8), vertical: 'middle' };
    lcell.border = allBorders();
    if (isGrand) { lcell.fill = solid('FF8FAADC'); lcell.font = { bold: true, color: { argb: 'FFFFFFFF' } }; }
    else if (isSub) { lcell.fill = solid('FFDCE6F3'); lcell.font = { bold: depth === 0 }; }
    else lcell.fill = solid('FFF5F8FC');
    maxLabelLen = Math.max(maxLabelLen, String(lcell.value).length + depth * 2);
    if (!isGrand) row.outlineLevel = Math.min(Math.max(depth, 0), 7);

    const rKey = isGrand ? '' : safeJoin(node.vals);
    const writeVal = (cell, v, isColSub) => {
      if (v !== null && v !== undefined) { cell.value = v; if (typeof v === 'number') cell.numFmt = numFmtCode(Number.isInteger(v)); }
      cell.alignment = { horizontal: 'right' }; cell.border = allBorders();
      let fill = null, bold = false;
      if (isGrand) { fill = 'FFB4C6E7'; bold = true; }
      else if (isSub && isColSub) { fill = 'FFC8D8EE'; bold = true; }
      else if (isColSub) { fill = 'FFDCE6F3'; bold = true; }
      else if (isSub) { fill = 'FFEDF1F8'; bold = true; }
      if (fill) cell.fill = solid(fill);
      if (bold) cell.font = { bold: true };
    };
    for (let i = 0; i < leafCols.length; i++) {
      const cell = sh.cellMap.get(rKey + '#' + safeJoin(leafCols[i].vals));
      for (let vi = 0; vi < nValues; vi++) writeVal(row.getCell(leafColStart(i) + vi), cell ? cell[vi] : null, !!leafCols[i].isColSubtotal);
    }
    if (hasColDims) {
      const gc = sh.cellMap.get(rKey + '#');
      for (let vi = 0; vi < nValues; vi++) writeVal(row.getCell(gtColStart + vi), gc ? gc[vi] : null, true);
    }
    r++;
  }

  // ── column outline levels (collapse detail columns into their subtotal) ──
  if (hasColDims) {
    for (let i = 0; i < leafCols.length; i++) {
      const lc = leafCols[i];
      const lvl = lc.isColSubtotal ? lc.depth : Math.max(0, lc.vals.length - 1);
      for (let vi = 0; vi < nValues; vi++) ws.getColumn(leafColStart(i) + vi).outlineLevel = Math.min(lvl, 7);
    }
    for (let vi = 0; vi < nValues; vi++) ws.getColumn(gtColStart + vi).outlineLevel = 0;
  }

  // ── widths, summary direction, freeze ──
  ws.getColumn(1).width = Math.min(50, Math.max(18, maxLabelLen + 2));
  const lastCol = gtColStart + (hasColDims ? nValues : 0) - 1;
  for (let c = firstDataCol; c <= lastCol; c++) ws.getColumn(c).width = nValues > 1 ? 16 : 14;
  try { ws.properties.outlineProperties = { summaryBelow: effSub === 'bottom', summaryRight: true }; } catch (_) {}
  ws.views = [{ state: 'frozen', xSplit: 1, ySplit: HEADER_ROWS }];
}

async function exportXlsx(source) {
  if (typeof ExcelJS === 'undefined') { toast(tt('excelLoading'), true); return; }
  try {
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Parquet Explorer';
    let fileBase = 'export';
    if (source === 'pivot') {
      if (!state.pivotShape || !state.pivotData) { toast(tt('buildPivotFirst'), true); return; }
      buildPivotSheet(wb); fileBase = (state.activeTable || 'pivot') + '_pivot';
    } else if (source === 'sql') {
      if (!state.sqlResult) { toast(tt('runQueryFirst'), true); return; }
      buildTableSheet(wb, 'Query', state.sqlResult.rows, state.sqlResult.columns); fileBase = 'query_result';
    } else {
      const tn = state.activeTable, table = state.tables.find(t => t.name === tn);
      const filters = state.filters[tn] || {}, sort = state.sorts[tn];
      const cols = table.schema.filter(c => !state.hidden[tn].has(c.name));
      const sql = `SELECT ${cols.map(c => qid(c.name)).join(', ')} FROM ${qid(tn)} ${buildWhere(table, filters)} ${sort ? `ORDER BY ${qid(sort.col)} ${sort.dir}` : ''}`;
      const res = await runQuery(sql);
      buildTableSheet(wb, tn, res.rows, cols); fileBase = tn;
    }
    const buf = await wb.xlsx.writeBuffer();
    const url = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    const a = document.createElement('a'); a.href = url; a.download = `${fileBase}_${Date.now()}.xlsx`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(tt('exportedExcel', activeLocale().intl));
  } catch (e) { console.error(e); toast(tt('excelFailed', e.message), true); }
}

async function doExport(source, format) {
  try {
    let sql; const tn = state.activeTable, table = state.tables.find(t => t.name === tn);
    if (source === 'table') {
      const filters = state.filters[tn] || {}, sort = state.sorts[tn];
      sql = `SELECT ${table.schema.filter(c => !state.hidden[tn].has(c.name)).map(c => qid(c.name)).join(', ')} FROM ${qid(tn)} ${buildWhere(table, filters)} ${sort ? `ORDER BY ${qid(sort.col)} ${sort.dir}` : ''}`;
    } else if (source === 'sql') { sql = sqlEditor ? sqlEditor.getValue() : state.sqlText; }
    else if (source === 'pivot') {
      const pv = state.pivot[tn], filterMap = {}; for (const f of [...pv.filters, ...pv.rows, ...pv.cols, ...pv.values]) if (f.filter) filterMap[f.col] = f.filter;
      const allDims = [...pv.rows.map(r => r.col), ...pv.cols.map(c => c.col)];
      const valExprs = pv.values.map((v) => `${v.agg === 'COUNT_DISTINCT' ? `COUNT(DISTINCT ${qid(v.col)})` : (v.agg === 'COUNT' ? `COUNT(${qid(v.col)})` : `${v.agg}(${qid(v.col)})`)} AS ${qid(v.col + '_' + v.agg)}`);
      sql = `SELECT ${[...allDims.map(qid), ...valExprs].join(', ')} FROM ${qid(tn)} ${buildWhere(table, filterMap)} ${allDims.length ? `GROUP BY ${allDims.map(qid).join(',')}` : ''}`;
    }
    const outName = `export_${Date.now()}.${format}`, copySQL = format === 'csv' ? `COPY (${sql}) TO '${outName}' (FORMAT CSV, HEADER true)` : format === 'json' ? `COPY (${sql}) TO '${outName}' (FORMAT JSON, ARRAY true)` : `COPY (${sql}) TO '${outName}' (FORMAT PARQUET)`;
    await state.conn.query(copySQL);
    const buf = await state.db.copyFileToBuffer(outName);
    const url = URL.createObjectURL(new Blob([buf], { type: format === 'json' ? 'application/json' : (format === 'csv' ? 'text/csv' : 'application/octet-stream') }));
    const a = document.createElement('a'); a.href = url; a.download = outName; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    try { await state.db.dropFile(outName); } catch (_) {}
    toast(tt('exported', outName));
  } catch (e) { toast(tt('exportFailed', e.message), true); }
}

// ============================================================
// SETTINGS & SESSION MENUS
// ============================================================
function buildRememberToggle() {
  return el('label', { class:'toggle', onclick: (e) => e.stopPropagation() },
    el('input', { type:'checkbox', checked: state.settings.rememberFiles ? '' : null, onchange: async (e) => {
      state.settings.rememberFiles = e.target.checked;
      if (e.target.checked) { for (const t of state.tables) { try { const b = await state.db.copyFileToBuffer(t.file); await idbPut(t.name, { fileName: t.origName || t.name, buffer: b.buffer.slice(b.byteOffset, b.byteOffset + b.byteLength) }); } catch (_) {} } toast(tt('rememberOn')); }
      else { try { await idbClear(); } catch (_) {} toast(tt('rememberOff')); }
      savePrefsNow(); updateSaveStatus();
    }}),
    el('span', { class:'track' })
  );
}
function openMenu(anchor, menu) {
  const close = () => { $('#dialog-root').innerHTML = ''; document.removeEventListener('mousedown', outside); };
  const outside = (ev) => { if (!menu.contains(ev.target) && ev.target !== anchor) close(); };
  menu._close = close;
  $('#dialog-root').appendChild(menu); setTimeout(() => document.addEventListener('mousedown', outside), 0);
}

function openSettingsMenu(anchor) {
  const check = (on) => el('span', { class:'check' }, on ? '✓' : '');
  let menu;
  const langItem = (key) => el('div', { class:'ctx-menu-item row', onclick: () => {
    state.settings.lang = key; applyStaticTexts();
    if (state.mode === 'sql') sqlEditor = null;     // force CodeMirror to re-attach to the new textarea
    renderAll(); refreshActiveView();
    if (state.mode === 'sql') setTimeout(initSQLEditor, 0);
    savePrefsNow(); menu._close();
  }}, el('span', null, check(state.settings.lang === key), ' ' + I18N[key].langName));
  const localeItem = (key) => el('div', { class:'ctx-menu-item row', onclick: () => {
    state.settings.locale = key; rebuildNumberFormats(); renderContent(); updateSaveStatus(); savePrefsNow(); menu._close();
  }}, el('span', null, check(state.settings.locale === key), ' ' + LOCALES[key].label));
  menu = el('div', { class:'ctx-menu', style:'right:16px; top:44px; min-width:230px;' },
    el('div', { class:'ctx-menu-h' }, tt('language')),
    langItem('de'), langItem('en'),
    el('div', { class:'ctx-menu-sep' }),
    el('div', { class:'ctx-menu-h' }, tt('numberDateFormat')),
    localeItem('de'), localeItem('en')
  );
  openMenu(anchor, menu);
}

function openSessionMenu(anchor) {
  let menu;
  const lastTime = state._lastSaved ? new Date(state._lastSaved).toLocaleTimeString(activeLocale().intl) : null;
  const statusText = state.settings.rememberFiles
    ? '✅ ' + tt('statusOn')
    : '⚠️ ' + tt('statusOff');
  menu = el('div', { class:'ctx-menu', style:'right:16px; top:44px; min-width:260px;' },
    el('div', { class:'ctx-menu-h' }, tt('session')),
    el('div', { class:'ctx-menu-item row', style:'cursor:default;', onclick: (e) => e.stopPropagation() }, el('span', null, tt('rememberToggle')), buildRememberToggle()),
    el('div', { class:'ctx-menu-item', style:'cursor:default; color:var(--text-dim); font-size:11px; display:flex; flex-direction:column; align-items:flex-start; gap:2px;', onclick: (e) => e.stopPropagation() },
      el('span', null, statusText),
      el('span', { style:'color:var(--text-faint);' }, lastTime ? tt('lastSaved', lastTime) : tt('neverSaved'))
    ),
    el('div', { class:'ctx-menu-sep' }),
    el('div', { class:'ctx-menu-item', onclick: () => { savePrefsNow(); toast(tt('settingsSaved')); menu._close(); } }, '💾 ' + tt('saveNow')),
    el('div', { class:'ctx-menu-item danger', onclick: async () => { menu._close(); if (confirm(tt('confirmClear'))) { try { localStorage.removeItem(PREFS_KEY); await idbClear(); } catch (_) {} toast(tt('clearedData')); } } }, '🗑 ' + tt('clearSaved'))
  );
  openMenu(anchor, menu);
}

// ============================================================
// SESSION RESTORE
// ============================================================
async function restoreSession(prefs) {
  if (!prefs || !state.settings.rememberFiles) return;
  let files;
  try { files = await idbGetAll(); } catch { return; }
  if (!files || files.length === 0) return;
  const order = Object.keys(prefs.tables || {});
  files.sort((a, b) => order.indexOf(a.key) - order.indexOf(b.key));
  setDbStatus('restoring');
  let restored = 0;
  for (const { key, value } of files) {
    try {
      const buf = new Uint8Array(value.buffer);
      await registerParquet(buf, value.fileName || (key + '.parquet'), { tableName: key, prefs, persist: false });
      restored++;
    } catch (e) { console.warn('Restore failed for', key, e); try { await idbDelete(key); } catch (_) {} }
  }
  setDbStatus('ready');
  if (!restored) return;
  state.mode = prefs.global?.mode || 'table';
  state.activeTable = (prefs.activeTable && state.tables.some(t => t.name === prefs.activeTable)) ? prefs.activeTable : state.tables[0].name;
  if (state.mode === 'pivot') { $('#sidebar').classList.add('collapsed'); $('#sidebar-toggle').textContent = tt('schemaHide'); }
  renderAll();
  refreshActiveView();
  if (state.mode === 'sql') setTimeout(initSQLEditor, 0);
  toast(tt('restored', restored));
}

// ============================================================
// BOOT
// ============================================================
(async () => {
  // Apply persisted global settings before first paint so the UI comes up consistent.
  const prefs = loadPrefs();
  if (prefs?.global) {
    const g = prefs.global;
    if (g.lang && I18N[g.lang]) state.settings.lang = g.lang;
    if (g.locale && LOCALES[g.locale]) state.settings.locale = g.locale;
    state.settings.rememberFiles = g.rememberFiles !== false;
    if (g.sidebarWidth) state.settings.sidebarWidth = g.sidebarWidth;
    if (g.pivotFieldsWidth) state.settings.pivotFieldsWidth = g.pivotFieldsWidth;
    if (g.filterDlgWidth) state.settings.filterDlgWidth = g.filterDlgWidth;
    if (g.filterDlgHeight) state.settings.filterDlgHeight = g.filterDlgHeight;
    if (g.pageSize) state.pageSize = g.pageSize;
    if (g.mode) state.mode = g.mode;
    if (typeof prefs.sqlText === 'string') state.sqlText = prefs.sqlText;
    rebuildNumberFormats();
  }

  const tbz = $('#tb-dropzone');
  tbz.addEventListener('dragover', (e) => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); tbz.classList.add('dragover'); } });
  tbz.addEventListener('dragleave', () => tbz.classList.remove('dragover'));
  tbz.addEventListener('drop', (e) => { e.preventDefault(); tbz.classList.remove('dragover'); if (e.dataTransfer.files?.length) loadFiles(e.dataTransfer.files); });
  tbz.addEventListener('click', () => $('#file-input').click());
  $('#sidebar-toggle').addEventListener('click', () => { const sb = $('#sidebar'); sb.classList.toggle('collapsed'); $('#sidebar-toggle').textContent = sb.classList.contains('collapsed') ? tt('schemaHide') : tt('schemaShow'); scheduleSave(); });
  $('#settings-btn').addEventListener('click', (e) => openSettingsMenu(e.currentTarget));
  $('#session-btn').addEventListener('click', (e) => openSessionMenu(e.currentTarget));
  $('#save-status').addEventListener('click', (e) => openSessionMenu(e.currentTarget));
  window.addEventListener('dragover', (e) => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', (e) => { if (e.dataTransfer.files?.length) { e.preventDefault(); loadFiles(e.dataTransfer.files); } });
  $('#file-input').addEventListener('change', (e) => { if (e.target.files?.length) loadFiles(e.target.files); e.target.value = ''; });
  if (prefs?.global?.sidebarCollapsed) { $('#sidebar').classList.add('collapsed'); }

  // Resizable schema sidebar (the splitter sits right after it in the DOM).
  applyPanelWidths();
  $('#sidebar').after(makeColResizer($('#sidebar'), '--sb-width', 'sidebarWidth', 150, 600));

  applyStaticTexts();
  renderAll();
  try { await initDuckDB(); } catch (e) { setDbStatus('failed'); toast(tt('duckFailed', e.message), true); return; }
  try { await restoreSession(prefs); } catch (e) { console.warn('Session restore failed:', e); }
})();
</script>
